<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Neon Chess Pro</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top, #0f2033 0%, #070e17 70%);
            color: #e6fbff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            user-select: none;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 320px;
            display: flex; flex-direction: column;
            align-items: center; gap: 12px;
            padding: 24px 20px;
            border: 1.5px solid rgba(0, 240, 255, 0.5);
            border-radius: 14px;
            background: rgba(9, 18, 29, 0.92);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
        }
        .title {
            font-size: 21px; font-weight: 900; letter-spacing: 1.5px;
            color: #00f0ff;
            text-align: center;
        }
        .subtitle {
            font-size: 11px; color: #8fd4e3; letter-spacing: 0.8px;
            text-align: center;
            margin-top: -6px;
        }
        .feature-pills {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
            margin: 2px 0;
        }
        .pill {
            font-size: 9px; font-weight: 800; letter-spacing: 0.5px;
            padding: 3px 7px; border-radius: 999px;
            border: 1px solid rgba(0, 240, 255, 0.35);
            background: rgba(0, 240, 255, 0.08);
            color: #9cecff;
        }
        .pill.gold {
            border-color: rgba(255, 209, 102, 0.45);
            background: rgba(255, 209, 102, 0.1);
            color: #ffd166;
        }
        .status-badge {
            font-size: 10px; font-weight: 800; letter-spacing: 0.6px;
            padding: 5px 12px; border-radius: 6px;
            border: 1px solid #00f59b;
            background: rgba(0, 245, 155, 0.12);
            color: #00f59b;
            margin-bottom: 2px;
        }
        .status-badge.loading {
            border-color: #ffaa00;
            background: rgba(255, 170, 0, 0.12);
            color: #ffaa00;
        }
        .btn {
            width: 100%; padding: 13px 16px;
            border: 1.5px solid #00f0ff;
            background: rgba(0, 240, 255, 0.1);
            color: #ffffff; font-size: 13px; font-family: inherit; font-weight: 800;
            letter-spacing: 0.5px;
            border-radius: 8px; cursor: pointer; text-align: center;
            transition: background 0.15s ease, transform 0.1s ease;
        }
        .btn:active { background: rgba(0, 240, 255, 0.28); transform: scale(0.99); }
        .btn-primary {
            background: linear-gradient(90deg, rgba(0, 180, 255, 0.25), rgba(0, 240, 255, 0.2));
            border-color: #00f0ff;
        }
        .btn-sub {
            border-color: #ffd166; color: #ffd166;
            background: rgba(255, 209, 102, 0.08);
        }
        .btn-sub:active { background: rgba(255, 209, 102, 0.24); }
        .hint {
            font-size: 10px; color: #7ca4b5;
            text-align: center; line-height: 1.45; margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">⚡ NEON CHESS PRO</div>
        <div class="subtitle">SMART AUTO-GAMBIT &amp; ENGINE HUD</div>

        <div class="feature-pills">
            <span class="pill gold">⚡ AUTO GAMBIT</span>
            <span class="pill">MULTI-PV STOCKFISH</span>
            <span class="pill">SAN + ARROWS</span>
        </div>

        <div class="status-badge loading" id="statusBadge">STATUS: LOADING HELPER...</div>

        <button class="btn btn-primary" id="btnOnline">PLAY LIVE CHESS</button>
        <button class="btn" id="btnHome">CHESS.COM HOME</button>
        <button class="btn" id="btnComputer">PLAY VS COMPUTER</button>
        <button class="btn btn-sub" id="btnLogin">LOGIN ACCOUNT (EMAIL)</button>

        <div class="hint">Auto-Gambit is active by default and picks sound match gambits automatically for White &amp; Black.</div>
    </div>

    <script src="cordova.js"></script>
    <script src="Helper.js"></script>
    <script>
        let helperCode = "";

        function markReady() {
            const badge = document.getElementById('statusBadge');
            if (badge) {
                badge.innerText = "STATUS: HELPER READY";
                badge.classList.remove('loading');
            }
        }

        function buildHelperPayload() {
            if (typeof window.initNeonChessHelper === 'function') {
                return "try { (" + window.initNeonChessHelper.toString() + ")(); } catch (e) { console.error('NeonHUD error:', e); }";
            }
            return "";
        }

        function loadHelperScript() {
            return new Promise((resolve) => {
                // 1. Immediate synchronous payload from loaded Helper.js script tag
                const inlinePayload = buildHelperPayload();
                if (inlinePayload) {
                    helperCode = inlinePayload;
                    markReady();
                    resolve(helperCode);
                    return;
                }

                // 2. Fallback via fetch / XHR (handles both Helper.js and helper.js)
                const tryFetch = (path) => fetch(path).then(r => {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.text();
                });

                tryFetch('Helper.js')
                    .catch(() => tryFetch('helper.js'))
                    .then(code => {
                        if (code && code.includes('neon-hud-panel')) {
                            helperCode = code + "\ntry { if (typeof initNeonChessHelper === 'function') initNeonChessHelper(); } catch (e) {}";
                            markReady();
                        }
                        resolve(helperCode);
                    })
                    .catch(() => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', 'Helper.js', true);
                        xhr.onload = function () {
                            if (xhr.responseText && xhr.responseText.includes('neon-hud-panel')) {
                                helperCode = xhr.responseText + "\ntry { if (typeof initNeonChessHelper === 'function') initNeonChessHelper(); } catch (e) {}";
                                markReady();
                            }
                            resolve(helperCode);
                        };
                        xhr.onerror = () => resolve(helperCode);
                        xhr.send();
                    });
            });
        }

        loadHelperScript();

        document.addEventListener('deviceready', function () {
            loadHelperScript();
        }, false);

        document.getElementById('btnOnline').addEventListener('click', function () {
            openChess('https://www.chess.com/play/online');
        });
        document.getElementById('btnHome').addEventListener('click', function () {
            openChess('https://www.chess.com/home');
        });
        document.getElementById('btnComputer').addEventListener('click', function () {
            openChess('https://www.chess.com/play/computer');
        });
        document.getElementById('btnLogin').addEventListener('click', function () {
            openChess('https://www.chess.com/login');
        });

        async function openChess(targetUrl) {
            if (!helperCode) {
                await loadHelperScript();
            }

            if (!window.cordova || !cordova.InAppBrowser) {
                window.location.href = targetUrl;
                return;
            }

            const options = [
                'location=no',
                'zoom=no',
                'hardwareback=yes',
                'clearcache=no',
                'clearsessioncache=no',
                'domstorage=yes',
                'mediaPlaybackRequiresUserAction=no',
                'shouldPauseOnSuspend=yes'
            ].join(',');

            const ref = cordova.InAppBrowser.open(targetUrl, '_blank', options);

            const injectHUD = function () {
                if (helperCode) {
                    ref.executeScript({ code: helperCode });
                }
            };

            ref.addEventListener('loadstop', injectHUD);
        }
    </script>
</body>
</html>
