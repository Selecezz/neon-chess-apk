<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Neon Chess Pro</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #080f16; color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px;
            user-select: none;
        }
        .card {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px;
            padding: 28px 24px;
            border: 1.5px solid rgba(0, 240, 255, 0.35);
            border-radius: 12px;
            background: rgba(15, 28, 41, 0.75);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
        }
        .title {
            font-size: 22px; font-weight: bold; letter-spacing: 2px;
            margin-bottom: 2px; text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }
        .subtitle {
            font-size: 11px; color: #88d8e6; letter-spacing: 1px;
            margin-bottom: 6px; text-align: center;
        }
        .status-badge {
            font-size: 11px; font-weight: bold;
            padding: 4px 10px; border-radius: 4px;
            border: 1px solid #00f0ff;
            background: rgba(0, 240, 255, 0.12);
            color: #00f0ff; margin-bottom: 6px;
        }
        .btn {
            width: 260px; padding: 14px 20px;
            border: 1.5px solid #00f0ff; background: rgba(0, 240, 255, 0.1);
            color: #fff; font-size: 14px; font-family: inherit; font-weight: bold;
            border-radius: 6px; cursor: pointer; text-align: center;
            transition: background 0.15s ease;
        }
        .btn:active { background: rgba(0, 240, 255, 0.3); }
        .btn-sub { border-color: #ffaa00; color: #ffaa00; background: rgba(255, 170, 0, 0.08); }
        .btn-sub:active { background: rgba(255, 170, 0, 0.25); }
        .hint {
            font-size: 10px; color: #6c99a8; max-width: 250px;
            text-align: center; line-height: 1.4; margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">⚡ NEON CHESS PRO</div>
        <div class="subtitle">CHESS ASSISTANT &amp; GAMBIT TRAINER</div>
        <div class="status-badge" id="statusBadge">STATUS: LOADING HELPER...</div>

        <button class="btn" id="btnHome">PLAY ONLINE (HOME)</button>
        <button class="btn" id="btnComputer">PLAY VS COMPUTER</button>
        <button class="btn btn-sub" id="btnLogin">LOGIN ACCOUNT (EMAIL)</button>

        <div class="hint">Log in to your account first or choose a mode above to launch with the Neon HUD overlay.</div>
    </div>

    <script src="cordova.js"></script>
    <script src="Helper.js"></script>
    <script>
        let helperCode = "";

        function buildHelperPayload() {
            if (typeof window.initNeonChessHelper === 'function') {
                return "(" + window.initNeonChessHelper.toString() + ")();";
            }
            return "";
        }

        function loadHelperScript() {
            return new Promise((resolve) => {
                // 1. Immediate synchronous payload from loaded Helper.js script tag
                const inlinePayload = buildHelperPayload();
                if (inlinePayload) {
                    helperCode = inlinePayload;
                    const badge = document.getElementById('statusBadge');
                    if (badge) badge.innerText = "STATUS: HELPER READY";
                    resolve(helperCode);
                    return;
                }

                // 2. Fallback via fetch / XHR (handles both Helper.js and helper.js)
                const tryFetch = (path) => fetch(path).then(r => {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.text();
                });

                tryFetch('Helper.js')
                    .catch(() => tryFetch('helper.js'))
                    .then(code => {
                        if (code && code.includes('neon-hud-panel')) {
                            helperCode = code + "\nif (typeof initNeonChessHelper === 'function') initNeonChessHelper();";
                            const badge = document.getElementById('statusBadge');
                            if (badge) badge.innerText = "STATUS: HELPER READY";
                        }
                        resolve(helperCode);
                    })
                    .catch(() => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', 'Helper.js', true);
                        xhr.onload = function () {
                            if (xhr.responseText && xhr.responseText.includes('neon-hud-panel')) {
                                helperCode = xhr.responseText + "\nif (typeof initNeonChessHelper === 'function') initNeonChessHelper();";
                                const badge = document.getElementById('statusBadge');
                                if (badge) badge.innerText = "STATUS: HELPER READY";
                            }
                            resolve(helperCode);
                        };
                        xhr.onerror = () => resolve(helperCode);
                        xhr.send();
                    });
            });
        }

        // Preload helper immediately so the launcher menu is ready before playing
        loadHelperScript();

        document.addEventListener('deviceready', function () {
            loadHelperScript();
        }, false);

        document.getElementById('btnHome').addEventListener('click', function () {
            openChess('https://www.chess.com/home');
        });
        document.getElementById('btnComputer').addEventListener('click', function () {
            openChess('https://www.chess.com/play/computer');
        });
        document.getElementById('btnLogin').addEventListener('click', function () {
            openChess('https://www.chess.com/login');
        });

        async function openChess(targetUrl) {
            if (!helperCode) {
                await loadHelperScript();
            }

            if (!window.cordova || !cordova.InAppBrowser) {
                window.location.href = targetUrl;
                return;
            }

            const options = [
                'location=no',
                'zoom=no',
                'hardwareback=yes',
                'clearcache=no',
                'clearsessioncache=no',
                'domstorage=yes',
                'mediaPlaybackRequiresUserAction=no',
                'shouldPauseOnSuspend=yes'
            ].join(',');

            const ref = cordova.InAppBrowser.open(targetUrl, '_blank', options);

            const injectHUD = function () {
                if (helperCode) {
                    ref.executeScript({ code: helperCode });
                }
            };

            ref.addEventListener('loadstop', injectHUD);
        }
    </script>
</body>
</html>
