<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Neon Chess</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #080f16; color: #00f0ff; font-family: monospace; display: flex; align-items: center; justify-content: center; }
        .btn { padding: 14px 24px; border: 1.5px solid #00f0ff; background: rgba(0,240,255,0.1); color: #fff; font-size: 16px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <button class="btn" id="launchBtn">BUKA CHESS.COM + HUD</button>
    <script src="cordova.js"></script>
    <script>
        document.addEventListener('deviceready', function () {
            document.getElementById('launchBtn').addEventListener('click', openChess);
            openChess();
        }, false);

        function openChess() {
            const ref = cordova.InAppBrowser.open('https://www.chess.com/play/computer', '_blank', 'location=no,zoom=no,hardwareback=yes');
            fetch('helper.js')
                .then(r => r.text())
                .then(code => {
                    ref.addEventListener('loadstop', function () {
                        ref.executeScript({ code: code });
                    });
                });
        }
    </script>
</body>
</html>
